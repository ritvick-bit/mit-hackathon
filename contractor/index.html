<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EQORE Contractor Portal</title>
  <link rel="stylesheet" href="../command-center/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <h1>Contractor Portal</h1>
        <p>Everything you owe across EQORE installs &middot; <span class="demo-tag">Demo data, not an EQORE catalog</span></p>
      </div>
    </div>
    <label class="ct-who">
      <span>Signed in as</span>
      <select id="party" aria-label="Contractor or agency"></select>
    </label>
    <div class="demo-jump">
      <a class="ct-link" href="../command-center/" target="eqore-pm">PM command center &#8599;</a>
      <button data-act="reset" class="ghost">Reset demo</button>
    </div>
  </header>

  <section class="metrics" id="metrics"></section>

  <main class="ct-main">
    <section>
      <div class="ct-head">
        <h2 id="list-title">Your items</h2>
        <div class="chips" id="filters">
          <button class="chip on" data-act="filter" data-f="open">Open</button>
          <button class="chip" data-act="filter" data-f="blocking">Holding up an install</button>
          <button class="chip" data-act="filter" data-f="all">All</button>
        </div>
      </div>
      <div id="items" class="ct-items"></div>
    </section>
    <aside class="ct-side">
      <h2>Activity</h2>
      <p class="ct-muted">Updates from every contractor and the PM. The command center reads the same record.</p>
      <ol id="log" class="ct-log"></ol>
    </aside>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="../command-center/data.js"></script>
  <script src="../command-center/engine.js"></script>
  <script src="parties.js"></script>
  <script src="app.js"></script>
</body>
</html>
