<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Synthetic field verification note: metering identification discrepancy</title><desc id="desc">Illustrative record, not a site photograph or wiring instruction. The observed meter label differs from the issued drawing reference; qualified review and correction evidence are required.</desc>
<rect width="1200" height="800" fill="#f4f4eb"/><rect x="40" y="40" width="1120" height="720" rx="14" fill="#fffef7" stroke="#d7decc" stroke-width="2"/>
<g font-family="Arial, sans-serif"><rect x="40" y="40" width="1120" height="70" rx="14" fill="#1e493b"/><text x="72" y="85" fill="#f2f4e6" font-size="22" font-weight="bold">FIELD VERIFICATION NOTE</text><text x="1120" y="85" fill="#d5e1cb" font-size="17" text-anchor="end">SYNTHETIC DEMO</text>
<text x="75" y="160" font-size="30" fill="#294d3e" font-weight="bold">Metering identification requires review</text><text x="75" y="196" font-size="19" fill="#819075">Illustrative schematic • not a site photo • no engineering settings shown</text>
<rect x="75" y="240" width="480" height="270" rx="8" fill="#eef2e6" stroke="#ccd8bf"/><text x="100" y="274" font-size="17" fill="#647e59" font-weight="bold">OBSERVED FIELD LABEL</text><rect x="170" y="306" width="280" height="128" rx="8" fill="#f9fbf5" stroke="#8fa786" stroke-width="3"/><rect x="198" y="329" width="224" height="58" rx="4" fill="#dfe9d4"/><text x="310" y="366" font-size="24" fill="#4e6c44" text-anchor="middle">METER / CT ID</text><text x="310" y="413" font-size="16" fill="#859578" text-anchor="middle">Identification record differs</text><text x="105" y="478" font-size="17" fill="#927b54">No wiring diagnosis established from this note.</text>
<rect x="590" y="240" width="535" height="270" rx="8" fill="#fbf4e6" stroke="#e3d5b7"/><text x="615" y="274" font-size="17" fill="#9a7d43" font-weight="bold">REVIEW FINDING</text><text x="615" y="316" font-size="20" fill="#6c6951">Field identification does not match</text><text x="615" y="346" font-size="20" fill="#6c6951">the issued single-line reference.</text><text x="615" y="396" font-size="18" fill="#8c7c5d">Qualified engineer: reconcile intended arrangement.</text><text x="615" y="431" font-size="18" fill="#8c7c5d">Electrical contractor: submit correction evidence.</text><text x="615" y="466" font-size="18" fill="#8c7c5d">Independent verifier: re-inspect the accepted scope.</text>
<rect x="75" y="545" width="1050" height="105" rx="8" fill="#f2e8dc"/><text x="100" y="581" font-size="19" fill="#a15a3b" font-weight="bold">VERIFICATION HOLD REMAINS OPEN</text><text x="100" y="617" font-size="18" fill="#8d7157">A vendor inquiry or PM cost approval does not establish technical acceptance or permission to operate.</text>
<text x="75" y="700" font-size="16" fill="#8d9a82">Fictional Riverbend Logistics case • authored demo attachment • original stakeholder report is the source record</text><text x="75" y="727" font-size="15" fill="#9aa68c">This schematic illustrates a workflow issue. It provides no installation instructions or equipment configuration.</text></g></svg>
