name: PM platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Model tests (schedule, products, edits, document-center plan and feed)
        run: node pm/model.test.js
      - name: Document center adapter and signing tests (no live credentials; DocuSign is faked)
        run: python -m unittest discover -s pm/doccenter -v
